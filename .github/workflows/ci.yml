# CI runs the same thing as `make check`, but on a clean machine.
# The point is not bureaucracy -- CI catches "works on my box": a file that was
# never committed, a missing dependency, a path with backslashes in it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch cancels the previous run -- saves minutes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Written on Windows, destined to run on Linux. Cheaper to learn about
        # the difference here than during the first deployment.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=netshift --cov-report=term-missing

      - name: CLI smoke test
        run: |
          uv run netshift version
          uv run netshift doctor
